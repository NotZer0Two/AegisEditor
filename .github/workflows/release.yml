name: Build Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: true

jobs:
  build:
    uses: .github/workflows/pr.yml
    with: 
      plugins-artifact: AegisEditor-release-${{ github.ref }}-plugins
      package-artifact: AegisEditor-release-${{ github.ref }}-package
    permissions:
      contents: write
      packages: read
  
  release:
    runs-on: ubuntu-latest
    needs: [ build ]
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: '*'
          merge-multiple: true
          path: assets

      - name: Upload assets
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: assets/*