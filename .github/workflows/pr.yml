name: PR Build

on:
  workflow_call:
  pull_request:
    branches: [ dev ]

inputs:
  plugins-artifact:
    required: false
    default: AegisEditor-pr-${{ github.event.pull_request.number }}-plugins
  package-artifact:
    required: false
    default: AegisEditor-pr-${{ github.event.pull_request.number }}-unitypackage

env:
  OUT: ${{ github.workspace }}/OUT
  PACKAGE: it.pyyra.aegiseditor

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        configuration: [ Debug, Release ]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Download SCP:SL references
        uses: Axwabo/scpsl-references-downloader@v1

      - name: Download Unity Editor reference
        uses: .github/actions/download-editor-ref.yml

      - name: Build
        run: dotnet build -c ${{ matrix.configuration }} -o ${{ env.OUT }}

      - name: Prepare Unity package
        if: matrix.configuration == 'Release'
        run: |
          find Packages -name \*.meta >> metaList
          cp ${{ env.OUT }}/AegisEditor.API.dll ${{ github.workspace }}/Packages/${{ env.PACKAGE }}/Runtime/
          cp ${{ env.OUT }}/AegisEditor.Editor.dll ${{ github.workspace }}/Packages/${{ env.PACKAGE }}/Editor/
          mkdir PackageOutput

      - name: Upload plugins
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ inputs.plugins-artifact }}
          retention-days: 7
          path: |
            ${{ env.OUT }}/AegisEditor.dll
            ${{ env.OUT }}/AegisEditor.API.dll

      - name: Create Unity package
        if: matrix.configuration == 'Release'
        uses: pCYSl5EDgo/create-unitypackage@master
        with:
          package-path: ${{ github.workspace }}/PackageOutput/${{ env.PACKAGE }}.unitypackage
          include-files: metaList

      - name: Upload Unity package
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.package-artifact }}
          retention-days: 7
          path: ${{ github.workspace }}/PackageOutput/${{ env.PACKAGE }}.unitypackage
