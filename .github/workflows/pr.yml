name: PR Build

on:
  pull_request:
    branches: [dev]

env:
  NET_FRAMEWORK_VERSION: "net48"
  PROJECT_NAME: "/AegisEditor"
  API_PROJECT_NAME: "/AegisEditor.API"
  EDITOR_PROJECT_NAME: "/AegisEditor.Editor"
  PACKAGE_NAME: "it.pyyra.aegiseditor"
  SL_REFERENCES: "${{ github.workspace }}/References"
  UNITY_REFERENCES: "${{ github.workspace }}/References"
  gameAssemblyReferences: "mscorlib.dll,System.dll,System.Core.dll,System.Data.dll,System.Data.DataSetExtensions.dll,System.Net.Http.dll,System.Xml.dll,System.Xml.Linq.dll,Pooling.dll,UnityEngine.dll,UnityEngine.CoreModule.dll,UnityEngine.PhysicsModule.dll,UnityEngine.AssetBundleModule.dll,UnityEngine.AnimationModule.dll,Unity.TextMeshPro.dll,UnityEngine.UI.dll,UnityEngine.IMGUIModule.dll,Assembly-CSharp-firstpass.dll,Assembly-CSharp.dll,LabApi.dll,NorthwoodLib.dll,CommandSystem.Core.dll,Mirror.dll,YamlDotNet.dll"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Download SCP SL References
        uses: killers0992/scpsl.downloadfiles@master
        with:
          branch: 'public'
          filesToDownload: ${{ env.gameAssemblyReferences }}

      - name: Add NuGet feed auth
        run: dotnet nuget update source github --username ${{ github.repository_owner }} --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text

      - name: Build API
        run: dotnet build ${{ github.workspace }}${{ env.API_PROJECT_NAME }}/AegisEditor.API.csproj --configuration ${{ matrix.configuration }}

      - name: Build Plugin
        run: dotnet build ${{ github.workspace }}${{ env.PROJECT_NAME }}/AegisEditor.csproj --configuration ${{ matrix.configuration }}

      - name: Build Editor
        run: dotnet build ${{ github.workspace }}${{ env.EDITOR_PROJECT_NAME }}/AegisEditor.Editor.csproj --configuration ${{ matrix.configuration }}

      - name: Prepare Unity package
        if: matrix.configuration == 'Release'
        run: |
          cd ${{ github.workspace }}
          find Packages -name \*.meta >> metaList
          cp ${{ github.workspace }}${{ env.API_PROJECT_NAME }}/bin/Release/${{ env.NET_FRAMEWORK_VERSION }}/AegisEditor.API.dll ${{ github.workspace }}/Packages/${{ env.PACKAGE_NAME }}/Runtime/AegisEditor.API.dll
          cp ${{ github.workspace }}${{ env.EDITOR_PROJECT_NAME }}/bin/Release/${{ env.NET_FRAMEWORK_VERSION }}/AegisEditor.Editor.dll ${{ github.workspace }}/Packages/${{ env.PACKAGE_NAME }}/Editor/AegisEditor.Editor.dll
          mkdir PackageOutput

      - name: Create Unity package
        if: matrix.configuration == 'Release'
        uses: pCYSl5EDgo/create-unitypackage@master
        with:
          package-path: ${{ github.workspace }}/PackageOutput/${{ env.PACKAGE_NAME }}.unitypackage
          include-files: metaList

      - name: Upload plugin
        if: matrix.configuration == 'Debug'
        uses: actions/upload-artifact@v4
        with:
          name: AegisEditor-pr-${{ github.event.pull_request.number }}-plugin
          retention-days: 7
          path: |
            ${{ github.workspace }}${{ env.PROJECT_NAME }}/bin/Debug/${{ env.NET_FRAMEWORK_VERSION }}/AegisEditor.dll
            ${{ github.workspace }}${{ env.API_PROJECT_NAME }}/bin/Debug/${{ env.NET_FRAMEWORK_VERSION }}/AegisEditor.API.dll

      - name: Upload Unity package
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: AegisEditor-pr-${{ github.event.pull_request.number }}-unitypackage
          retention-days: 7
          path: ${{ github.workspace }}/PackageOutput/${{ env.PACKAGE_NAME }}.unitypackage