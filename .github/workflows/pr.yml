name: PR Build

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches: [ dev ]

env:
  OUT: ${{ github.workspace }}/OUT
  PACKAGE: it.pyyra.aegiseditor

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        configuration: [ Debug, Release ]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Download SCP:SL references
        uses: Axwabo/scpsl-references-downloader@v1

      - name: Get Unity Editor DLL from cache
        id: download-unity-editor-dll
        uses: actions/cache@v6.1.0
        with:
          key: UnityEditor-2021.3.17f1
          restore-keys: UnityEditor-2021.3.17f1
          path: ${{ env.ReferencePath }}/UnityEditor.dll # TODO: update path later

      - name: Setup Unity
        id: unity-setup
        uses: buildalon/unity-setup@v2.6.0
        if: ${{ steps.download-unity-editor-dll.outputs.cache-hit }} == ''
        with:
          version-file: None
          unity-version: 2021.3.17f1
          hub-version: 3.14.3 # disables auto-update; keeps /opt/unityhub

      - name: Copy Editor DLL
        if: ${{ steps.unity-setup.outputs.unity-editor-path }} != ''
        run: |
          UNITY_DIR=$(dirname "${{ steps.unity-setup.outputs.unity-editor-path }}")
          cp "$UNITY_DIR/Data/Managed/UnityEngine/UnityEditor.dll" "${{ env.ReferencePath }}/"

      - name: Build
        run: dotnet build -c ${{ matrix.configuration }} -o ${{ env.OUT }}

      - name: Prepare Unity package
        if: matrix.configuration == 'Release'
        run: |
          find Packages -name \*.meta >> metaList
          cp ${{ env.OUT }}/AegisEditor.API.dll ${{ github.workspace }}/Packages/${{ env.PACKAGE }}/Runtime/
          cp ${{ env.OUT }}/AegisEditor.Editor.dll ${{ github.workspace }}/Packages/${{ env.PACKAGE }}/Editor/
          mkdir PackageOutput

      - name: Upload plugins
        uses: actions/upload-artifact@v7.0.2
        with:
          name: plugins
          retention-days: 7
          path: |
            ${{ env.OUT }}/AegisEditor.dll
            ${{ env.OUT }}/AegisEditor.API.dll

      - name: Create Unity package
        if: matrix.configuration == 'Release'
        uses: pCYSl5EDgo/create-unitypackage@master
        with:
          package-path: ${{ github.workspace }}/PackageOutput/${{ env.PACKAGE }}.unitypackage
          include-files: metaList

      - name: Upload Unity package
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: unitypackage
          retention-days: 7
          path: ${{ github.workspace }}/PackageOutput/${{ env.PACKAGE }}.unitypackage
